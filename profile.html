<!DOCTYPE html>
<html>
<head>
    <title>파엠 만자천홍 데이터베이스</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>

    <meta name="description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:title" content="파엠 만자천홍 데이터베이스">
    <meta property="og:type" content="website">
    <meta property="og:description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:site_name" content="파엠 만자천홍 데이터베이스">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/select2.min.css"/>
    <style>
        #profile-image {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: contain;
            background: #fff;
            border: 1px solid #dee2e6;
        }

        .profile-detail-box {
            min-height: 3rem;
            padding: 5px;
        }

        .profile-info-box {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            column-gap: .5rem;
        }

        .profile-info-title,
        .profile-info-content {
            white-space: nowrap;
        }

        .profile-info-content {
            text-align: right;
            overflow-x: auto;
        }

        .profile-info-box .divider {
            grid-column: 1 / -1;
        }

        .divider {
            border-top: 1px solid #dee2e6;
            margin: .3rem 0;
        }

        .profile-table td {
            height: 2.6rem;
        }

        .profile-table td:first-child {
            width: 5ch;
            white-space: nowrap;
        }

        .profile-detail-content,
        .profile-table td:last-child {
            white-space: pre-line;
        }
    </style>

</head>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"
        crossorigin="anonymous"></script>

<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="navBar">
    <div class="container-fluid" style="margin : 0 10px">
        <a class="navbar-brand" href="index.html">만자천홍 데이터</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            </ul>
        </div>
    </div>
</nav>
<div class = "container">
    <br>
    <div class = "row">
        <div class= "col">
            <h3>프로필</h3>
            <p>배포되지 않은 DLC 2,3탄의 스포일러일 가능성이 있는 더미 데이터가 포함되어 있습니다.<br>열람 시 주의 바랍니다.</p>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class= "col">
            <!-- unit filter -->
            <select id="unit" class="form-select" style="width: 100%" disabled>
                <option value="">전체</option>
            </select>
            <br>
            <select id="unit-option" class="form-select" style="width: 100%" disabled>
                <option value="">전체</option>
            </select>
            <div id="profile-error" class="text-danger mt-2" role="alert" hidden></div>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class = "col">
            <h3 id = "profile-title">-</h3>
        </div>
    </div>
    <div class="row g-3">
        <div class="col-12 col-md-4">
            <img id="profile-image" alt="">
            <div class="row g-2 mt-1 large-div">
                <div class="profile-detail-title">기본 정보</div>
                <div class="divider"></div>
                <div class="col-6"><div class="profile-detail-box profile-info-box">
                    <div class = "profile-info-title">생일</div>
                    <div class = "profile-info-content" id = "profile-birthday">-</div>
                    <div class="divider"></div>
                </div></div>
                <div class="col-6"><div class="profile-detail-box profile-info-box">
                    <div class = "profile-info-title">출생년도</div>
                    <div class = "profile-info-content" id = "profile-age">-</div>
                    <div class="divider"></div>
                </div></div>
                <div class="col-6"><div class="profile-detail-box profile-info-box">
                    <div class = "profile-info-title">신장</div>
                    <div class = "profile-info-content" id = "profile-height">-</div>
                    <div class="divider"></div>
                </div></div>
            </div>
        </div>
        <div class="col-12 col-md-8">
            <div class="table-responsive">
                <table class="table table-bordered profile-table" id = "profile-table">
                    <tbody></tbody>
                </table>
            </div>
            <div class="row g-2 large-div">
                <div class="col-6"><div class="profile-detail-box">
                    <div class="profile-detail-title">좋아하는 것</div>
                    <div class="divider"></div>
                    <div class="profile-detail-content" id ="profile-like">-</div>
                </div></div>
                <div class="col-6"><div class="profile-detail-box">
                    <div class="profile-detail-title">취미</div>
                    <div class="divider"></div>
                    <div class="profile-detail-content" id ="profile-hobby">-</div>
                </div></div>
                <div class="col-6"><div class="profile-detail-box">
                    <div class="profile-detail-title">싫어하는 것</div>
                    <div class="divider"></div>
                    <div class="profile-detail-content" id ="profile-dislike">-</div>
                </div></div>
            </div>
        </div>
    </div>
    <div class = "row">
        <div class = "col">
            <br>
        </div>
    </div>
</div>

<script src="assets/js/nav.js"></script>
<script>
    $(document).ready(function () {
        NavInitiator.initiate();

        const $unit = $('#unit');
        const $option = $('#unit-option');
        const $tableBody = $('#profile-table tbody');
        let profiles = [];
        let logs = {};

        $unit.select2({width: '100%'});
        $option.select2({width: '100%'});

        function displayText(value) {
            return String(value ?? '').replace(/<br\s*\/?>/gi, '\n');
        }

        function renderHistory(entries) {
            $tableBody.empty();
            for (let i = 0; i < Math.max(10, entries.length); i++) {
                const entry = entries[i];
                const $row = $('<tr>');
                $row.append($('<td>').text(entry ? (entry.year <= 0 ? '불명' : entry.year) : ''));
                $row.append($('<td>').text(entry ? displayText(entry.text) : ''));
                $tableBody.append($row);
            }
        }

        const $image = $('#profile-image');

        // 이미지 로드 실패 시 흰 박스 유지
        $image.on('error', function () {
            $image.removeAttr('src');
        });

        function setImage(icon) {
            if (icon) {
                $image.attr('src', 'image/profile/' + encodeURIComponent(icon) + '.png');
            } else {
                $image.removeAttr('src');
            }
        }

        function clearProfile() {
            setImage(null);
            $('#profile-title, #profile-birthday, #profile-age, #profile-height, ' +
                '#profile-like, #profile-dislike, #profile-hobby').text('-');
            renderHistory([]);
        }

        function showProfile(id) {
            const profile = profiles.find(row => row.id === id);
            if (!profile) {
                clearProfile();
                return;
            }

            setImage(profile.icon);
            $('#profile-title').text([profile.subname, profile.name].filter(Boolean).join(' '));
            $('#profile-birthday').text(profile.m + '/' + profile.d);
            $('#profile-age').text(profile.y === 0 ? '불명' : profile.y + '년');
            $('#profile-height').text(profile.height);
            $('#profile-like').text(displayText(profile.like));
            $('#profile-dislike').text(displayText(profile.dislike));
            $('#profile-hobby').text(displayText(profile.hobby));

            if (!Object.prototype.hasOwnProperty.call(logs, id)) {
                renderHistory([]);
                $('#profile-error').text('프로필 경력을 찾을 수 없습니다.').prop('hidden', false);
                return;
            }
            $('#profile-error').prop('hidden', true).text('');
            renderHistory(logs[id]);
        }

        renderHistory([]);

        $unit.on('change', function () {
            const selected = $unit.val();
            const matching = profiles.filter(row => row.idx_name === selected);
            $option.empty();
            matching.forEach(row => {
                $option.append($('<option>').val(row.id).text(row.sub || '기본'));
            });
            $option.prop('disabled', matching.length === 0);
            if (matching.length) {
                $option.val(matching[0].id);
                showProfile(matching[0].id);
            } else {
                $option.append($('<option>').val('').text('전체'));
                $('#profile-error').prop('hidden', true).text('');
                clearProfile();
            }
            $option.trigger('change.select2');
        });

        $option.on('change', function () {
            showProfile($option.val());
        });

        $.when(
            $.getJSON('data/profile_mod.json'),
            $.getJSON('data/profile-log.json')
        ).done(function (profileResponse, logResponse) {
            profiles = profileResponse[0];
            logs = logResponse[0];
            [...new Set(profiles.map(row => row.idx_name))].forEach(name => {
                $unit.append($('<option>').val(name).text(name));
            });
            $unit.prop('disabled', false);
            $unit.trigger('change.select2');
        }).fail(function (request, status, error) {
            console.error('프로필 데이터를 불러오지 못했습니다.', status, error);
            $('#profile-error').text('프로필 데이터를 불러오지 못했습니다.').prop('hidden', false);
        });
    });
</script>
</body>
</html>
