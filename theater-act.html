<script>
    $(function () {
        const filters = {
            kind : null,
            finalOnly : false
        }

        function applyFilters() {
            $("#mainTable").bootstrapTable("filterBy", {}, {
                filterAlgorithm: function (row) {
                    return (!filters.type || row.type === filters.type);
                }
            });
        }

        function filterByType(type) {
            filters.type = type;
            applyFilters();
        }

        $("#perfect").on("click", function () { filterByType("대성공"); });
        $("#great").on("click", function () { filterByType("성공"); });
        $("#normal").on("click", function () { filterByType("보통"); });
        $("#bad").on("click", function () { filterByType("실패"); });
        $("#all").on("click", function () { filterByType(null); });
    });
</script>
