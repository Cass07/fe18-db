<!DOCTYPE html>

<head>
    <title>파엠 만자천홍 데이터베이스</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>

    <meta name="description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:title" content="파엠 만자천홍 데이터베이스">
    <meta property="og:type" content="website">
    <meta property="og:description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:site_name" content="파엠 만자천홍 데이터베이스">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/select2.min.css"/>

</head>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"
        crossorigin="anonymous"></script>

<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="navBar">
    <div class="container-fluid" style="margin : 0 10px">
        <a class="navbar-brand" href="index.html">만자천홍 데이터</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            </ul>
        </div>
    </div>
</nav>
<div class = "container">
    <br>
    <div class = "row">
        <div class= "col">
            <button class="btn btn-primary" id="sword">검</button>
            <button class="btn btn-primary" id="lance">창</button>
            <button class="btn btn-primary" id="axe">도끼</button>
            <button class="btn btn-primary" id="bow">활</button>
            <button class="btn btn-primary" id="gauntlet">건틀릿</button>
            <button class="btn btn-primary" id="equip">기타 장비</button>
            <button class="btn btn-primary" id="all">전체</button>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class= "col">
            <label><input type = checkbox id="is-final"> 최종강화만 표시</label>
            <label><input type = checkbox id="not-enemy"> 적 전용 제외</label>
        </div>
    </div>
    <div class = "row">
        <div class = "col">
            <table id = "mainTable"
                   data-search="false"
                   data-toggle="table"
                   data-url="data/weapon.json"
                   data-detail-view="true"
                   data-detail-view-by-click="true"
                   data-detail-formatter="detailFormatter"
                   data-show-columns="true">
                <thead>
                <tr>
                    <th data-field="name" data-sortable="true">이름</th>
                    <th data-field="might" data-sortable="true">위력</th>
                    <th data-field="weight" data-sortable="true">무게</th>
                    <th data-field="hit" data-sortable="true">명중</th>
                    <th data-field="avoid" data-sortable="true" data-visible="false">회피</th>
                    <th data-field="crit" data-sortable="true">필살</th>
                    <th data-field="range" data-sortable="true">사거리</th>
                    <th data-field="uses" data-sortable="true">내구</th>
                    <th data-field="rank" data-sortable="true">무기랭크</th>
                    <th data-field="desc" data-sortable="true" data-visible="false">설명</th>
                    <th data-field="kind" data-sortable="true" data-visible="false">속성</th>
                    <th data-field="final" data-visible="false">최종 여부</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
    <div class = "row">
        <div class = "col">
            <br>
        </div>
    </div>
</div>

<script src="assets/js/nav.js"></script>
<script>
    $(document).ready(function () {
        NavInitiator.initiate();
    });
</script>
</body>
</html>

<script>
    const STAT_LABELS = [["might", "위력"], ["weight", "무게"], ["hit", "명중"], ["avoid", "회피"], ["crit", "필살"], ["range", "사거리"]];
    const WEAPON_KIND_LABELS = [["sword", "검"], ["lance", "창"], ["axe", "도끼"], ["bow", "활"], ["gauntlet", "건틀릿"], ["equip", "기타 장비"]];
    const REPAIR_LABEL = [["repair_re", "수리 재료"], ["repair_cnt", "수량"], ["repair_gold", "골드"]];
    const FORGE_LABEL = [["forge_re", "연성 재료"], ["forge_cnt", "수량"], ["forge_gold", "골드"]];

    function detailFormatter(index, row) {
        const lb = "<br>";

        const weaponDesc = `<h5>무기</h5>${row.name} : ${row.desc}`;

        const weaponStatTable = '<div class="table-responsive"><table class="table table-bordered table-sm mb-0 w-auto">'
            + '<tr>' + STAT_LABELS.map(s => '<th>' + s[1] + '</th>').join("") + '</tr>'
            + '<tr>' + STAT_LABELS.map(s => '<td>' + (row[s[0]] === ""? 0 : row[s[0]]) + '</td>').join("") + '</tr></table></div>';

        const isRepairable = row.repair_re !== "" && row.repair_cnt !== "" && row.repair_gold !== "";
        const isForgeable = row.forge_re !== "" && row.forge_cnt !== "" && row.repair_gold !== "";

        const repairTable = '<div class="table-responsive"><table class="table table-bordered table-sm mb-0 w-auto">'
            + '<tr>' + REPAIR_LABEL.map(s => '<th>' + s[1] + '</th>').join("") + '</tr>'
            + '<tr>' + REPAIR_LABEL.map(s => '<td>' + (row[s[0]] === ""? 0 : row[s[0]]) + '</td>').join("") + '</tr></table></div>';

        const repairItemUrlText = row.repair_re !== "" ? `<a href="${getItemMapUrl(row.repair_re)}">${row.repair_re} 습득 위치</a>` : "";

        const forgeTable = '<div class="table-responsive"><table class="table table-bordered table-sm mb-0 w-auto">'
            + '<tr>' + FORGE_LABEL.map(s => '<th>' + s[1] + '</th>').join("") + '</tr>'
            + '<tr>' + FORGE_LABEL.map(s => '<td>' + (row[s[0]] === ""? 0 : row[s[0]]) + '</td>').join("") + '</tr></table></div>';

        const forgeItemUrlText = row.forge_re !== "" ? `<a href="${getItemMapUrl(row.forge_re)}">${row.forge_re} 습득 위치</a>` : "";

        const isEnemyOnlyText = Number(row.isEnemy) === 1 ? "<br>적 전용" : "";

        return weaponDesc + isEnemyOnlyText + lb + lb
            + weaponStatTable + lb
            + (isRepairable ? repairTable + repairItemUrlText + lb + lb : "")
            + (isForgeable ? forgeTable + forgeItemUrlText+ lb + lb: "");
    }
    function getItemMapUrl(itemName) {
        return `spot-map.html?tab=item&row=spot%7C${itemName}`
    }

    $(function () {
        const filters = {
            kind : null,
            finalOnly : false,
            notEnemyOnly : false
        }

        function applyFilters() {
            $("#mainTable").bootstrapTable("filterBy", {}, {
                filterAlgorithm: function (row) {
                    return (!filters.kind || row.kind === filters.kind)
                        && (!filters.finalOnly || Number(row.final) === 1)
                        && (!filters.notEnemyOnly || Number(row.isEnemy) === 0);
                }
            });
        }

        $('#is-final').on('change', function () {
            filters.finalOnly = this.checked;
            applyFilters();
        });

        $('#not-enemy').on('change', function () {
            filters.notEnemyOnly = this.checked;
            applyFilters();
        });

        function filterByKind(kind) {
            filters.kind = kind;
            applyFilters();
        }

        $("#sword").on("click", function () { filterByKind("sword"); });
        $("#lance").on("click", function () { filterByKind("lance"); });
        $("#axe").on("click", function () { filterByKind("axe"); });
        $("#bow").on("click", function () { filterByKind("bow"); });
        $("#gauntlet").on("click", function () { filterByKind("gauntlet"); });
        $("#equip").on("click", function () { filterByKind("equip"); });
        $("#all").on("click", function () { filterByKind(null); });
    });
</script>
