<!DOCTYPE html>
<html>
<head>
    <title>파엠 만자천홍 데이터베이스</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>

    <meta name="description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:title" content="파엠 만자천홍 데이터베이스">
    <meta property="og:type" content="website">
    <meta property="og:description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:site_name" content="파엠 만자천홍 데이터베이스">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/select2.min.css"/>

</head>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"
        crossorigin="anonymous"></script>

<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="navBar">
    <div class="container-fluid" style="margin : 0 10px">
        <a class="navbar-brand" href="index.html">만자천홍 데이터</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            </ul>
        </div>
    </div>
</nav>
<div class = "container">
    <br>
    <div class = "row">
        <div class= "col">
            <h3>아이템 상자 확률</h3>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class = "col">
            <select id = "boxSelect" class = "unit-dropdown" style = "width: 100%;">
            </select>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class = "col">
            <table id = "mainTable"
                   data-search="true"
                   data-toggle="table"
                   data-url="data/box.json"
                   data-show-columns="true">
                <thead>
                <tr>
                    <th data-field="box" data-sortable="true">상자 종류</th>
                    <th data-field="item" data-sortable="true">아이템</th>
                    <th data-field="weight" data-sortable="true">가중치</th>
                    <th data-field="chance" data-sortable="true">계산확률</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
    <div class = "row">
        <div class = "col">
            <br>
        </div>
    </div>
</div>

<script src="assets/js/nav.js"></script>
<script>

    const BOX_NAME = [
        '수수한 무구 상자', '질 좋은 무구 상자', '고급 무구 상자', '다 미나의 무구 상자',
        '연성 청동 무구 상자', '연성 철 무구 상자', '연성 무구 상자', '연성 다 미나 무구 상자',
        '책 상자', '비장의 책 상자', '선물 상자', '반지 상자', '떠내려온 나무 상자',
        '수수께끼의 상자', '고기 상자', '고급 고기 상자', '야채 상자', '고급 야채 상자',
        '생선 상자', '고급 생선 상자', '광석 상자', '보주 상자'
    ]

    function filterByBox() {
        const selected = $('#boxSelect').val();
        $('#mainTable').bootstrapTable('filterBy', {box: selected});
    }

    $(document).ready(function () {
        NavInitiator.initiate();

        $('#boxSelect').select2({
            data: BOX_NAME.map(function (name) {
                return {id: name, text: name};
            }),
        });

        $('#boxSelect').on('change', filterByBox);
        $('#mainTable').on('load-success.bs.table', filterByBox);
    });
</script>
</body>
</html>

<script>

</script>
