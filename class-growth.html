<!DOCTYPE html>
<html>
<head>
    <title>파엠 만자천홍 데이터베이스</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>

    <meta name="description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:title" content="파엠 만자천홍 데이터베이스">
    <meta property="og:type" content="website">
    <meta property="og:description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:site_name" content="파엠 만자천홍 데이터베이스">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/select2.min.css"/>

</head>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"
        crossorigin="anonymous"></script>

<body>
<div class = "container">
    <br>
    <div class = "row">
        <div class = "col">
            <h3>클래스 성장률</h3>
            <label><input type = checkbox id="is-spoiler-avail">스포일러 표시</label>
            <table id = "mainTable"
                   data-search="true"
                   data-toggle="table"
                   data-url="data/class_growth.json"
                   data-show-columns="true">
                <thead>
                <tr>
                    <th data-field="name" data-sortable="true">이름</th>
                    <th data-field="rank_text" data-sortable="true">랭크</th>
                    <th data-field="hp" data-sortable="true">HP</th>
                    <th data-field="str" data-sortable="true">힘</th>
                    <th data-field="mg" data-sortable="true">마력</th>
                    <th data-field="spd" data-sortable="true">속도</th>
                    <th data-field="dex" data-sortable="true">기술</th>
                    <th data-field="def" data-sortable="true">수비</th>
                    <th data-field="res" data-sortable="true">마방</th>
                    <th data-field="lck" data-sortable="true">행운</th>
                    <th data-field="cha" data-sortable="true">매력</th>
                    <th data-field="master_skill" data-visible="false">마스터 스킬</th>
                    <th data-field="class_skill_1" data-visible="false">클래스 스킬 1</th>
                    <th data-field="class_skill_2" data-visible="false">클래스 스킬 2</th>
                    <th data-field="class_skill_3" data-visible="false">클래스 스킬 3</th>
                    <th data-field="require" data-visible="false">요구치</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
</div>

</body>
</html>

<script>

    function saveCheckboxStatesToCookie(checkboxStates) {
        // 쿠키 수명 13개월로 설정
        let expirationDate = new Date();
        expirationDate.setMonth(expirationDate.getMonth() + 13);
        document.cookie = "spoiler=" + checkboxStates + "; expires=" + expirationDate.toUTCString() + "; path=/";
    }

    function loadCheckboxStatesFromCookie() {
        let match = document.cookie.match(/(?:^|;\s*)spoiler=([^;]*)/);
        return match ? match[1] === "true" : false;
    }

    // 스포일러 미표시 시 rank 4 이하만 표시
    function applySpoilerFilter() {
        let isSpoilerAvail = $('#is-spoiler-avail').is(':checked');
        $('#mainTable').bootstrapTable('filterBy', {}, {
            filterAlgorithm: function (row) {
                return isSpoilerAvail || Number(row.rank) <= 4;
            }
        });
    }

    $(function () {
        $('#is-spoiler-avail').prop('checked', loadCheckboxStatesFromCookie());
        $('#is-spoiler-avail').on('change', function () {
            saveCheckboxStatesToCookie($(this).is(':checked'));
            applySpoilerFilter();
        });
        applySpoilerFilter();
    });

</script>
