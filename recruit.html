    $(document).ready(function () {

    $(document).on('change', '#table input[type="checkbox"]', function () {

    $(document).on('click', '#resetButton', function () {

    $(document).on('click', '#backupButton', function () {
        $('#backupText').val(makeBackupString());
    });

    $(document).on('click', '#restoreButton', function () {
        restoreFromBackupString($('#backupText').val());
    });

    function makeUnitRecruitCheckerTextFromRoute(unitObject, routeCharacter) {
        let route = routeCharacter.toLowerCase();
        let checkboxId = route + '_' + unitObject.name;
        if (unitObject[route + "_r"] === 0 && unitObject[route + "_b"] === 0) {
            return `<label>영입 불가<br><input type="checkbox" id="${checkboxId}" disabled></label>`;
        }
        let recruitText = "명성" + unitObject[route + "_r"] + " / 지원 " + unitObject[route + "_b"];
        return `<label>${recruitText}<br><input type="checkbox" id="${checkboxId}"></label>`;
    }

    function makeTableData() {
        let tableData = [];
        for (const element of recruitData) {
            let unitObject = element;
            let tableRow = {
                name: unitObject.name,
                c: makeUnitRecruitCheckerTextFromRoute(unitObject, "c"),
                d: makeUnitRecruitCheckerTextFromRoute(unitObject, "d"),
                t: makeUnitRecruitCheckerTextFromRoute(unitObject, "t"),
                l: makeUnitRecruitCheckerTextFromRoute(unitObject, "l"),
                des: unitObject.des
            };
            tableData.push(tableRow);
        }
        return tableData;
    }

    function getCheckboxStates() {
        let checkboxStates = {};
        $('#table input[type="checkbox"]').each(function () {
            let checkboxId = $(this).attr('id');
            checkboxStates[checkboxId] = $(this).prop('checked');
        });
        return checkboxStates;
    }

    function saveCheckboxStatesCookie() {
        saveCheckboxStatesToCookie(getCheckboxStates());
    }

    function saveCheckboxStatesToCookie(checkboxStates) {
        // 쿠키 수명 13개월로 설정
        let expirationDate = new Date();
        expirationDate.setMonth(expirationDate.getMonth() + 13);
        document.cookie = "checkboxStates=" + JSON.stringify(checkboxStates) + "; expires=" + expirationDate.toUTCString() + "; path=/";
    }

    function  getCheckboxStatesFromCookie() {
        let cookieValue = document.cookie.split('; ').find(row => row.startsWith('checkboxStates='));
        if (cookieValue) {
            return JSON.parse(cookieValue.split('=')[1]);
        }
        return {};
    }

    function resetCheckboxStates() {
        $('#table input[type="checkbox"]').prop('checked', false);
        saveCheckboxStatesCookie();
    }

    function makeBackupString() {
        let checkboxStates = getCheckboxStates();
        return LZString.compressToEncodedURIComponent(JSON.stringify(checkboxStates));
    }

    function restoreFromBackupString(backupString) {
        if (!backupString) {
            alert("백업 문자열을 입력해주세요.");
            return;
        }

        let checkboxStates;
        try {
            let json = LZString.decompressFromEncodedURIComponent(backupString.trim());
            checkboxStates = JSON.parse(json);
        } catch (e) {
            checkboxStates = null;
        }

        if (!checkboxStates || typeof checkboxStates !== 'object') {
            alert("백업 문자열을 읽을 수 없습니다.");
            return;
        }

        // 복원한 상태를 쿠키에 쓰고, 쿠키를 읽어서 체크박스에 반영
        saveCheckboxStatesToCookie(checkboxStates);
        updateCheckboxStatesFromCookie();
    }

    function updateCheckboxStatesFromCookie() {
        let checkboxStates = getCheckboxStatesFromCookie();
        $('#table input[type="checkbox"]').each(function () {
            let checkboxId = $(this).attr('id');
            if (checkboxStates.hasOwnProperty(checkboxId)) {
                $(this).prop('checked', checkboxStates[checkboxId]);
            }
        });
    }
