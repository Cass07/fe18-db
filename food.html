<script>
    const TYPE_MAP = {
        "肉" : "고기",
        "魚" : "생선",
        "野菜" : "야채"
    }

    const FLAVOR_MAP = {
        "甘味" : "단맛",
        "苦味" : "쓴맛",
        "辛味" : "매운맛",
        "珍味" : "진미"
    }

    const FOOD_RANK = ["비선호", "보통", "선호", "매우 선호"];
    const FOOD_RANK_FIELDS = ["bad", "good", "great", "perfect"];
    let unitFoods = null;
    fetch("data/unit-food.json").then(res => res.ok ? res.json() : []).catch(() => [])
        .then(list => unitFoods = list);

    function typeFormatter(value, row, index) {
        return TYPE_MAP[value] || value;
    }
    function flavorFormatter(value, row, index) {
        return FLAVOR_MAP[value] || value;
    }

    function detailFormatter(index, row) {
        if (unitFoods === null) return "불러오는 중...";
        const foodName = String(row.name).trim();
        const html = FOOD_RANK.map((label, i) => {
            const units = unitFoods
                .filter(u => String(u[FOOD_RANK_FIELDS[i]] || "").split("|").map(n => n.trim()).includes(foodName))
                .map(u => u.option ? u.name + " [" + u.option + "]" : u.name)
                .sort((a, b) => a.localeCompare(b, "ko"));
            return {label, units};
        }).reverse().filter(r => r.units.length > 0)
            .map(r => '<p class="mb-1"><b>' + r.label + '</b> : ' + r.units.join(", ") + '</p>')
            .join("");
        return html || "선호 유닛 정보가 없습니다.";
    }
</script>
