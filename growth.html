<!DOCTYPE html>
<html>
<head>
    <title>파엠 만자천홍 데이터베이스</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>

    <meta name="description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:title" content="파엠 만자천홍 데이터베이스">
    <meta property="og:type" content="website">
    <meta property="og:description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:site_name" content="파엠 만자천홍 데이터베이스">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/select2.min.css"/>

</head>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"
        crossorigin="anonymous"></script>

<body>
<div class = "container">
    <br>
    <div class = "row">
        <div class = "col">
            <p>검색 옆 오른쪽 아이콘 눌러서 원하는 컬럼 보기 가능</p>
            <button class="btn btn-primary" id="show-stat">성장률 보기</button>
            <button class="btn btn-primary" id="show-skill">개인스킬 보기</button>
            <button class="btn btn-primary" id="show-boonbain">기술 강약점 보기</button>
        </div>
    </div>
    <div class = "row">
        <div class = "col">
            <label><input type = checkbox id="is-spoiler-avail">스포일러 표시</label>
            <table id = "mainTable"
                   data-search="true"
                   data-toggle="table"
                   data-url="data/growth.json"
                   data-show-columns="true">
                <thead>
                <tr>
                    <th data-field="name" data-sortable="true">이름</th>
                    <th data-field="hp" data-sortable="true">HP</th>
                    <th data-field="str" data-sortable="true">힘</th>
                    <th data-field="mg" data-sortable="true">마력</th>
                    <th data-field="spd" data-sortable="true">속도</th>
                    <th data-field="dex" data-sortable="true">기술</th>
                    <th data-field="def" data-sortable="true">수비</th>
                    <th data-field="res" data-sortable="true">마방</th>
                    <th data-field="lck" data-sortable="true">행운</th>
                    <th data-field="cha" data-sortable="true">매력</th>
                    <th data-field="sum" data-sortable="true">합계</th>
                    <th data-field="p_skill" data-visible="false">개인스킬</th>
                    <th data-field="u_skill" data-visible="false">유니크 스킬</th>
                    <th data-field="spoiler" data-visible="false"></th>
                    <th data-field="sword" data-visible="false">검</th>
                    <th data-field="lance" data-visible="false">창</th>
                    <th data-field="axe" data-visible="false">도끼</th>
                    <th data-field="bow" data-visible="false">활</th>
                    <th data-field="gauntlet" data-visible="false">격투</th>
                    <th data-field="black_magic" data-visible="false">흑마법</th>
                    <th data-field="white_magic" data-visible="false">백마법</th>
                    <th data-field="authority" data-visible="false">지휘</th>
                    <th data-field="infantry" data-visible="false">보행</th>
                    <th data-field="riding" data-visible="false">기마</th>
                    <th data-field="armor" data-visible="false">중갑</th>
                    <th data-field="flying" data-visible="false">비행</th>
                    <th data-field="boon" data-visible="false">강점</th>
                    <th data-field="bane" data-visible="false">약점</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
</div>

</body>
</html>

<script src="assets/js/spoiler.js"></script>

<script>
    function applySpoilerFilter() {
        let isSpoilerAvail = $('#is-spoiler-avail').is(':checked');
        $('#mainTable').bootstrapTable('filterBy', {}, {
            filterAlgorithm: function (row) {
                return isSpoilerAvail || Number(row.spoiler) === 0;
            }
        });
    }

    const STAT_COLUMNS = ['name', 'hp', 'str', 'mg', 'spd', 'dex', 'def', 'res', 'lck', 'cha', 'sum'];
    const SKILL_COLUMNS = ['name', 'p_skill', 'u_skill'];
    const SKILL_BOONBAIN_COLUMNS = ['name', 'boon','bane'];

    function showOnlyColumns(visibleColumns) {
        let $table = $('#mainTable');

        let concat_colums = STAT_COLUMNS.concat(SKILL_COLUMNS).concat(SKILL_BOONBAIN_COLUMNS);

        concat_colums.forEach(function (field) {
            $table.bootstrapTable(visibleColumns.includes(field) ? 'showColumn' : 'hideColumn', field);
        });
    }

    $('#show-stat').on('click', function () {
        showOnlyColumns(STAT_COLUMNS);
    });

    $('#show-skill').on('click', function () {
        showOnlyColumns(SKILL_COLUMNS);
    });

    $('#show-boonbain').on('click', function () {
        showOnlyColumns(SKILL_BOONBAIN_COLUMNS);
    });

</script>
