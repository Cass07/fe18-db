<!DOCTYPE html>
<html>
<head>
    <title>파엠 만자천홍 데이터베이스</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>

    <meta name="description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:title" content="파엠 만자천홍 데이터베이스">
    <meta property="og:type" content="website">
    <meta property="og:description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:site_name" content="파엠 만자천홍 데이터베이스">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/select2.min.css"/>

</head>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"
        crossorigin="anonymous"></script>

<body>
<div class = "container">
    <div class = "row">
        <div class = "col">
            <br>
            <h2>기술레벨 습득 스킬, 전투기술</h2>
            <a href = "https://docs.google.com/spreadsheets/d/1Gbyq1MLTn3pWnvN9LQ1K8W4CSsAvFduetDZzUhbVcz0/edit?usp=sharing">정리중인 스프레드시트</a>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class = "col">
            <select class="select_kind" id="kind" style="width : 100%;">
            </select>
        </div>
    </div>

    <div class = "row">
        <div class = "col">
            <table id = "mainTable"
                   data-search="false"
                   data-toggle="table"
                   data-show-columns="true"
                   data-detail-view="true"
                   data-detail-view-by-click="true"
                   data-detail-formatter="detailFormatter">
                <thead>
                <tr>
                    <th data-field="name" data-sortable="true">이름</th>
                    <th data-field="desc" data-sortable="true">설명</th>
                    <th data-field="kind" data-sortable="true">기술 종류</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
    <div class = "row">
        <div class = "col">
            <br>
        </div>
    </div>
</div>

</body>
</html>

<script>
    const RANK_ORDER = ["E", "D", "D+", "C", "C+", "B", "B+", "A", "A+", "S"];
    const KIND_ORDER = ["전체", "검", "창", "도끼", "활", "격투", "지휘", "보행", "기병", "중갑", "비행"];
    const UNIT_FILES = ["armor", "authority", "axe", "bow", "faith", "flying", "gauntlet", "infantry", "lance", "reason", "riding", "sword"];
    let allSkills = [];
    let unitSkills = null;

    const fetchJson = url => fetch(url).then(res => res.ok ? res.json() : []).catch(() => []);

    $("#kind").select2({
        data: KIND_ORDER.map(kind => ({id: kind, text: kind})),
        minimumResultsForSearch: Infinity
    }).val(KIND_ORDER[0]).trigger("change");

    $("#kind").on("change", function () {
        const kind = $(this).val();
        $("#mainTable").bootstrapTable("load", kind === "전체" ? allSkills : allSkills.filter(s => s.kind === kind));
    });

    Promise.all([fetchJson("data/skills.json"), fetchJson("data/combat_arts.json")]).then(([skills, arts]) => {
        allSkills = skills.concat(arts);
        $("#kind").trigger("change");
    });

    Promise.all(UNIT_FILES.map(f => fetchJson("data/unit_" + f + ".json"))).then(lists => {
        unitSkills = lists.flat();
    });

    function detailFormatter(index, row) {
        if (unitSkills === null) {
            return "불러오는 중...";
        }

        const ranks = RANK_ORDER.concat("S+");
        const byRank = {};
        unitSkills.forEach(unit => {
            ranks.forEach(rank => {
                const cell = unit[rank];
                if (!cell) return;
                String(cell).split(/[,\r\n]+/).forEach(entry => {
                    entry = entry.trim();
                    if (!entry) return;
                    const match = entry.match(/^([\s\S]*?)\s*(\([\s\S]*\))?$/);
                    if (!match || match[1] !== row.name) return;
                    (byRank[rank] = byRank[rank] || []).push(unit.name + (match[2] || ""));
                });
            });
        });

        const lines = ranks
            .filter(rank => byRank[rank])
            .map(rank => rank + " : " + byRank[rank].sort((a, b) => a.localeCompare(b, "ko")).join(", "));

        return row.desc + "<br><br>" + (lines.length > 0 ? lines.join("<br>") : "습득하는 유닛이 없습니다.");
    }
</script>
