<!DOCTYPE html>
<html>
<head>
    <title>파엠 만자천홍 데이터베이스</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>

    <meta name="description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:title" content="파엠 만자천홍 데이터베이스">
    <meta property="og:type" content="website">
    <meta property="og:description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:site_name" content="파엠 만자천홍 데이터베이스">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/select2.min.css"/>

    <style>
        /* 내용 길이와 관계없이 컬럼 너비 고정. 너비를 지정하지 않은 rank 컬럼은 남은 너비를 균등 분배 */
        #mainTable {
            table-layout: fixed;
            width: 100%;
        }

        /* 화면이 좁으면 컬럼을 줄이지 않고 가로 스크롤. 테이블 최소 너비는 script 에서 보이는 컬럼 수로 계산 */
        .fixed-table-body {
            overflow-x: auto;
        }

        /* 한글이 단어 중간에서 끊기지 않도록 띄어쓰기 단위로 줄바꿈 */
        #mainTable th,
        #mainTable td {
            word-break: keep-all;
            overflow-wrap: break-word;
        }
    </style>
</head>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/select2.min.js"></script>
<script src="assets/js/unit-list.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"
        crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/extensions/sticky-header/bootstrap-table-sticky-header.css" crossorigin="anonymous">
<script src="https://unpkg.com/bootstrap-table@1.22.1/dist/extensions/sticky-header/bootstrap-table-sticky-header.min.js"
        crossorigin="anonymous"></script>

<body>
<div class = "container">
    <br>
    <div class = "row">
        <div class = "col">
            <select id="skill-kind" class="unit-dropdown" style="width: 100%">
            </select>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class = "col">
            <table id = "mainTable"
                   data-search="false"
                   data-show-columns="true">
                <thead>
                <tr>
                    <th data-field="name" data-sortable="true" data-width="12" data-width-unit="%">이름</th>
                    <th data-field="E" data-sortable="true" data-formatter="rankFormatter">기본</th>
                    <th data-field="D" data-sortable="true" data-formatter="rankFormatter">D</th>
                    <th data-field="D+" data-sortable="true" data-formatter="rankFormatter">D+</th>
                    <th data-field="C" data-sortable="true" data-formatter="rankFormatter">C</th>
                    <th data-field="C+" data-sortable="true" data-formatter="rankFormatter">C+</th>
                    <th data-field="B" data-sortable="true" data-formatter="rankFormatter">B</th>
                    <th data-field="B+" data-sortable="true" data-formatter="rankFormatter">B+</th>
                    <th data-field="A" data-sortable="true" data-formatter="rankFormatter">A</th>
                    <th data-field="A+" data-sortable="true" data-formatter="rankFormatter">A+</th>
                    <th data-field="S" data-sortable="true" data-formatter="rankFormatter">S</th>
                    <th data-field="S+" data-sortable="true" data-formatter="rankFormatter">S+</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
    <div class = "row">
        <div class = "col">
            <br>
        </div>
    </div>
</div>

</body>
</html>

<script>
    const RANK_ORDER = ["E", "D", "D+", "C", "C+", "B", "B+", "A", "A+", "S", "S+"];
    // 파일에 따라 존재하지 않을 수 있는 컬럼
    const OPTIONAL_RANKS = ["E", "S+"];
    // 컬럼별 최소 너비(px)
    const NAME_MIN_WIDTH = 90;
    const RANK_MIN_WIDTH = 80;

    // 콤마로 구분된 값은 한 줄에 하나씩 표시
    function rankFormatter(value) {
        if (!value) {
            return '';
        }
        return String(value).split(',').map(v => v.trim()).join('<br>');
    }

    $(function () {
        const $kind = $('#skill-kind');
        const $table = $('#mainTable');
        const cache = {};

        // 보이는 컬럼 수에 맞춰 테이블 최소 너비를 갱신
        function updateMinWidth() {
            const rankCount = $table.bootstrapTable('getVisibleColumns').filter(c => c.field !== 'name').length;
            $table.css('min-width', NAME_MIN_WIDTH + rankCount * RANK_MIN_WIDTH + 'px');
        }

        // UNIT_LIST 순서의 index. 목록에 없는 유닛은 맨 뒤로
        function unitOrder(name) {
            const index = UNIT_LIST.indexOf(name);
            return index === -1 ? UNIT_LIST.length : index;
        }

        // 파일에 없는 rank 값은 빈 값으로 채우고, E / S+ 컬럼이 파일에 없으면 숨김
        function loadTable(rows) {
            const existing = new Set(rows.flatMap(row => Object.keys(row)));
            RANK_ORDER.forEach(rank => {
                rows.forEach(row => {
                    if (row[rank] === undefined || row[rank] === null) {
                        row[rank] = '';
                    }
                });
            });
            OPTIONAL_RANKS.forEach(rank => {
                $table.bootstrapTable(existing.has(rank) ? 'showColumn' : 'hideColumn', rank);
            });
            updateMinWidth();
            const sorted = rows.slice().sort((a, b) => unitOrder(a.name) - unitOrder(b.name));
            $table.bootstrapTable('load', sorted);
        }

        $table.bootstrapTable({data: [], stickyHeader: true});
        updateMinWidth();
        $table.on('column-switch.bs.table', updateMinWidth);

        $.getJSON('data/skill-kind.json', function (kinds) {
            $kind.empty().append($('<option>').val('').text('기술 종류'));
            kinds.forEach(k => $kind.append($('<option>').val(k.file).text(k.name)));
            $kind.val('').select2();
        });

        $kind.on('change', function () {
            const file = $kind.val();
            if (!file) {
                loadTable([]);
                return;
            }
            if (cache[file]) {
                loadTable(cache[file]);
                return;
            }
            $.getJSON('data/' + encodeURIComponent(file) + '.json', function (rows) {
                cache[file] = rows;
                // 응답 도착 전에 다른 종류로 바뀌었다면 무시
                if ($kind.val() === file) {
                    loadTable(rows);
                }
            }).fail(function () {
                loadTable([]);
            });
        });
    });
</script>
