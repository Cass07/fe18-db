<!DOCTYPE html>
<html>
<head>
    <title>파엠 만자천홍 데이터베이스</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>

    <meta name="description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:title" content="파엠 만자천홍 데이터베이스">
    <meta property="og:type" content="website">
    <meta property="og:description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:site_name" content="파엠 만자천홍 데이터베이스">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/select2.min.css"/>

</head>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"
        crossorigin="anonymous"></script>

<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="navBar">
    <div class="container-fluid" style="margin : 0 10px">
        <a class="navbar-brand" href="index.html">만자천홍 데이터</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            </ul>
        </div>
    </div>
</nav>
<div class = "container">
    <br>
    <div class = "row">
        <div class= "col">
            <h3>선물</h3>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class= "col">
            <!-- unit filter -->
            <select id="unitFilter" class="form-select" style="width: 100%">
                <option value="">전체</option>
            </select>
            <div id="unitInfo" class="mt-2" style="display:none">
                <div><b>제일 선호하는 선물:</b> <span id="infoPerfect"></span></div>
                <div><b>비선호 선물:</b> <span id="infoBad"></span></div>
                <div><b style="color:blue">좋아하는 속성:</b> <span id="infoLike"></span></div>
                <div><b style="color:red">싫어하는 속성:</b> <span id="infoDislike"></span></div>
            </div>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class= "col">
            <div class="btn-group mb-2" role="group" aria-label="AND/OR">
                <input type="radio" class="btn-check" name="attrMode" id="attrModeAnd" value="and" autocomplete="off" checked>
                <label class="btn btn-outline-primary btn-sm" for="attrModeAnd">AND</label>
                <input type="radio" class="btn-check" name="attrMode" id="attrModeOr" value="or" autocomplete="off">
                <label class="btn btn-outline-primary btn-sm" for="attrModeOr">OR</label>
            </div>
            <button type="button" id="attrReset" class="btn btn-outline-danger btn-sm mb-2 ms-1">초기화</button>
            <div id="attrFilter" class="d-flex flex-wrap gap-1"></div>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class = "col">
            <table id = "mainTable"
                   data-search="true"
                   data-toggle="table"
                   data-url="data/present.json"
                   data-show-columns="true">
                <thead>
                <tr>
                    <th data-field="name" data-sortable="true" data-formatter="nameFormatter">이름</th>
                    <th data-field="price" data-sortable="true">가격</th>
                    <th data-field="attr" data-sortable="true" data-formatter="attrFormatter">속성</th>
                    <th data-field="desc" data-sortable="true" data-formatter="descFormatter">설명</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
    <div class = "row">
        <div class = "col">
            <br>
        </div>
    </div>
</div>

<script src="assets/js/nav.js"></script>
<script>
    $(document).ready(function () {
        NavInitiator.initiate();
    });
</script>
</body>
</html>

<script>
    function nameFormatter(value, row) {
        const src = `image/icon_item/pre_${row.rank - 1}.png`;
        return`<img src="${src}" style="height:1.5em; vertical-align:middle; margin-right:2px"> ${value}`;
    }
    const preAttrMap = {};
    $.ajax({
        url: 'data/pre-attr.json',
        dataType: 'json',
        async: false,
        success: function (list) {
            list.forEach(item => preAttrMap[item.id] = item.kor);
        }
    });

    function loadJson(url) {
        let result = [];
        $.ajax({url: url, dataType: 'json', async: false, success: d => result = d});
        return result;
    }

    const splitIds = s => (s || '').split('|').map(v => v.trim()).filter(v => v);
    const allPresents = loadJson('data/present.json');
    const presentMap = {};
    allPresents.forEach(p => presentMap[p.id] = p.name);
    const unitList = loadJson('data/unit-present.json');
    let currentUnit = null;

    function attrFormatter(value, row) {
        if (!value) return '';
        return value.split('|').map(v => {
            const kor = preAttrMap[v] || v;
            if (currentUnit && currentUnit.likes.includes(v)) return `<b style="color:blue">${kor}</b>`;
            if (currentUnit && currentUnit.dislikes.includes(v)) return `<b style="color:red">${kor}</b>`;
            return kor;
        }).join(', ');
    }

    function descFormatter(value, row) {
        if (!currentUnit || row._label === undefined) return value;
        return `${value} <span class="text-muted">(${row._label})</span>`;
    }

    // 유닛 선택
    unitList.forEach((u, i) => {
        $('#unitFilter').append(new Option(u.option ? `${u.name} - ${u.option}` : u.name, i));
    });
    $('#unitFilter').select2();

    const korAttrs = ids => ids.map(v => preAttrMap[v] || v).join(', ') || '-';
    const korPresents = ids => ids.map(v => presentMap[v] || v).join(', ') || '-';

    function buildRows(unit) {
        const rows = allPresents.map(p => {
            const row = Object.assign({}, p);
            if (!unit) return row;
            let score = 0;
            splitIds(p.attr).forEach(a => {
                if (unit.likes.includes(a)) score++;
                if (unit.dislikes.includes(a)) score--;
            });
            if (unit.perfect.includes(p.id)) {
                row._sort = 1e9;
                row._label = '최고';
            } else if (unit.bad.includes(p.id)) {
                score = Math.min(score, -1);
                row._sort = score;
                row._label = score;
            } else {
                row._sort = score;
                row._label = score > 0 ? '+' + score : score;
            }
            return row;
        });
        if (unit) rows.sort((a, b) => b._sort - a._sort);
        return rows;
    }

    $('#unitFilter').on('change', function () {
        const u = $(this).val() === '' ? null : unitList[$(this).val()];
        if (u) {
            currentUnit = {
                perfect: splitIds(u.pre_perfect),
                bad: splitIds(u.pre_bad),
                likes: splitIds(u.attr_like),
                dislikes: splitIds(u.attr_dislike)
            };
            $('#infoPerfect').text(korPresents(currentUnit.perfect));
            $('#infoBad').text(korPresents(currentUnit.bad));
            $('#infoLike').text(korAttrs(currentUnit.likes));
            $('#infoDislike').text(korAttrs(currentUnit.dislikes));
            $('#unitInfo').show();
        } else {
            currentUnit = null;
            $('#unitInfo').hide();
        }
        $('#mainTable').bootstrapTable('load', buildRows(currentUnit));
        applyAttrFilter();
    });

    // 속성 필터
    Object.keys(preAttrMap).forEach((id, i) => {
        $('#attrFilter').append(
            `<input type="checkbox" class="btn-check attr-check" id="attr_${i}" value="${id}" autocomplete="off">` +
            `<label class="btn btn-outline-secondary btn-sm" for="attr_${i}">${preAttrMap[id]}</label>`
        );
    });

    function applyAttrFilter() {
        const selected = $('.attr-check:checked').map(function () { return this.value; }).get();
        const isAnd = $('input[name=attrMode]:checked').val() === 'and';
        $('#mainTable').bootstrapTable('filterBy', {}, {
            filterAlgorithm: function (row) {
                if (selected.length === 0) return true;
                const attrs = (row.attr || '').split('|');
                return isAnd
                    ? selected.every(s => attrs.includes(s))
                    : selected.some(s => attrs.includes(s));
            }
        });
    }

    $(document).on('change', '.attr-check, input[name=attrMode]', applyAttrFilter);

    $('#attrReset').on('click', function () {
        $('.attr-check').prop('checked', false);
        $('#attrModeAnd').prop('checked', true);
        applyAttrFilter();
    });
</script>
