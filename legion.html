    <meta property="og:type" content="website">
    <meta property="og:description" content="파엠 만자천홍 데이터베이스">
    <meta property="og:site_name" content="파엠 만자천홍 데이터베이스">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/css/select2.min.css"/>
    <style>
        .aoe-table { border-collapse: collapse; table-layout: fixed; border: 1px solid lightgray; }
        .aoe-cell { width: 10px; height: 10px; min-width: 10px; padding: 0; border: 1px solid lightgray; line-height: 0; }
        .aoe-circle { width: 10px; height: 10px; box-sizing: border-box; border: 2px solid #000; border-radius: 50%; background: #fff; }

</head>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
        integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/bootstrap-table@1.22.1/dist/bootstrap-table.min.js"
        crossorigin="anonymous"></script>

<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light" id="navBar">
    <div class="container-fluid" style="margin : 0 10px">
        <a class="navbar-brand" href="index.html">만자천홍 데이터</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            </ul>
        </div>
    </div>
</nav>
<div class = "container">
    <br>
    <div class = "row">
        <div class= "col">
            <h3>군단병</h3>
        </div>
        <p>적 전용 데이터도 있습니다.</p>
    </div>
    <br>
    <div class = "row">
        <div class= "col">
            <button class="btn btn-primary" id="물리">물리</button>
            <button class="btn btn-primary" id="마법">마법</button>
            <button class="btn btn-primary" id="회복">회복</button>
            <button class="btn btn-primary" id="ZOC">ZOC</button>
            <button class="btn btn-primary" id="all">전체</button>
        </div>
    </div>
    <br>
    <div class = "row">
        <div class = "col">
            <table id = "mainTable"
                   data-search="true"
                   data-toggle="table"
                   data-url="data/legion.json"
                   data-detail-view="true"
                   data-detail-view-by-click="true"
                   data-detail-formatter="detailFormatter"
                   data-show-columns="true">
                <thead>
                <tr>
                    <th data-field="name" data-sortable="true">이름</th>
                    <th data-field="rank" data-sortable="true">랭크</th>
                    <th data-field="gambit_name" data-sortable="true">계략 이름</th>
                    <th data-field="kind" data-sortable="true">속성</th>
                    <th data-field="might" data-sortable="true">계략 위력</th>
                    <th data-field="hit" data-sortable="true" data-visible="false">명중</th>
                    <th data-field="uses" data-sortable="true" data-visible="false">횟수</th>
                    <th data-field="str" data-sortable="true">힘</th>
                    <th data-field="mg" data-sortable="true">마력</th>
                    <th data-field="spd" data-sortable="true">속도</th>
                    <th data-field="dex" data-sortable="true">기술</th>
                    <th data-field="def" data-sortable="true">수비</th>
                    <th data-field="res" data-sortable="true">마방</th>
                    <th data-field="cha" data-sortable="true">매력</th>
                    <th data-field="desc" data-sortable="true" data-visible="false">설명</th>
                    <th data-field="gambit_desc" data-sortable="true" data-visible="false">계략 설명</th>
                    <th data-field="isRare" data-visible="false">레어 여부</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
    <div class = "row">
        <div class = "col">
            <br>
        </div>
    </div>
</div>

<script src="assets/js/nav.js"></script>
<script>
    $(document).ready(function () {
        NavInitiator.initiate();
    });
</script>
</body>
</html>

<script>
    const STAT_LABELS = [["str", "힘"], ["mg", "마력"], ["spd", "속도"], ["dex", "기술"], ["def", "수비"], ["res", "마방"], ["cha", "매력"]];
    const LEGION_AOE_COLOR = {
        "물리" : "#d93f3f",
        "마법" : "#d93f3f",
        "회복" : "#3bd92e",
        "ZOC" : "#487cff"
    }

    // legion_aoe.json 로드 (idx -> table)
    const AOE_MAP = {};
    $.ajax({
        url: "data/legion_aoe.json",
        dataType: "json",
        async: false,
        success: function (data) {
            data.forEach(d => { AOE_MAP[d.idx] = d.table; });
        }
    });

    function aoeTable(aoeId, kind) {
        const raw = AOE_MAP[aoeId];
        if (!raw) return "";
        const color = LEGION_AOE_COLOR[kind] || "#999";
        const rows = raw.split(";").filter(r => r !== "").map(r => r.split(",").map(Number));
        const maxCols = Math.max(...rows.map(r => r.length));

        const circle = '<div class="aoe-circle"></div>';

        const body = rows.map(r => {
            let tds = "";
            for (let i = 0; i < maxCols; i++) {
                const v = r[i] || 0;
                if (v === 1) {
                    tds += `<td class="aoe-cell" style="background:${color};"></td>`;
                } else if (v === 2) {
                    tds += `<td class="aoe-cell">${circle}</td>`;
                } else {
                    tds += `<td class="aoe-cell"></td>`;
                }
            }
            return `<tr>${tds}</tr>`;
        }).join("");

        return '<table class="aoe-table">' + body + '</table>';
    }

    function detailFormatter(index, row) {
        const lb = "<br>";

        const legionDesc = `<h5>군단병</h5>${row.rank} : ${row.name} : ${row.desc}`;

        const gambitDesc = `<h5>계략</h5>${row.gambit_name} : ${row.gambit_desc}`;

        const statTable = '<div class="table-responsive"><table class="table table-bordered table-sm mb-0 w-auto">'
            + '<tr>' + STAT_LABELS.map(s => '<th>' + s[1] + '</th>').join("") + '</tr>'
            + '<tr>' + STAT_LABELS.map(s => '<td>' + (row[s[0]] === ""? 0 : row[s[0]]) + '</td>').join("") + '</tr></table></div>';

        const gambitTable = '<div class="table-responsive"><table class="table table-bordered table-sm mb-0 w-auto">'
            + '<tr><th>속성</th><th>위력</th><th>명중</th><th>횟수</th></tr>'
            + '<tr><td>' + row.kind + '</td><td>' + row.might + '</td><td>' + row.hit + '</td><td>' + row.uses + '</td></tr></table></div>';

        const aoeTable = '<h5>계략 범위</h5>' + aoeTable(row.aoe, row.kind);

        return legionDesc + lb + lb + statTable + lb + gambitDesc + lb + lb + gambitTable + lb + aoeTable;
    }

    $(function () {
        const filters = {
            kind : null,
            finalOnly : false
        }

        function applyFilters() {
            $("#mainTable").bootstrapTable("filterBy", {}, {
                filterAlgorithm: function (row) {
                    return (!filters.kind || row.kind === filters.kind)
                        && (!filters.finalOnly || Number(row.final) === 1);
                }
            });
        }

        $('#is-final').on('change', function () {
            filters.finalOnly = this.checked;
            applyFilters();
        });

        function filterByKind(kind) {
            filters.kind = kind;
            applyFilters();
        }

        $("#물리").on("click", function () { filterByKind("물리"); });
        $("#회복").on("click", function () { filterByKind("회복"); });
        $("#마법").on("click", function () { filterByKind("마법"); });
        $("#ZOC").on("click", function () { filterByKind("ZOC"); });
        $("#all").on("click", function () { filterByKind(null); });
    });
</script>
